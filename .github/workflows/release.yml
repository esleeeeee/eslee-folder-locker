name: Build Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Validate tag and installer compiler
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $versions = @(([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($versions.Count -ne 1) { throw 'Exactly one nonempty source version is required.' }
          $source = [string]$versions[0]
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $version -ne $source) { throw 'Tag must match source version.' }
          if (-not (Test-Path ".github/release-notes/v$version.md")) { throw 'Missing release notes.' }
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }

      - name: Restore
        run: dotnet restore .\FolderGate.sln

      - name: Build
        run: dotnet build .\FolderGate.sln -c Release --no-restore

      - name: Test core project
        run: dotnet test .\tests\FolderGate.Core.Tests\FolderGate.Core.Tests.csproj -c Release --no-build

      - name: Test app project
        run: dotnet test .\tests\FolderGate.App.Tests\FolderGate.App.Tests.csproj -c Release --no-build

      - name: Publish app
        run: dotnet publish .\src\FolderGate.App\FolderGate.App.csproj -c Release -r win-x64 --self-contained false -o .\artifacts\publish

      - name: Publish elevated helper
        run: dotnet publish .\src\FolderGate.ElevatedHelper\FolderGate.ElevatedHelper.csproj -c Release -r win-x64 --self-contained false -o .\artifacts\publish

      - name: Publish recovery tool
        run: dotnet publish .\src\FolderGate.RecoveryTool\FolderGate.RecoveryTool.csproj -c Release -r win-x64 --self-contained false -o .\artifacts\publish

      - name: Create English executable aliases
        shell: pwsh
        run: |
          Copy-Item .\artifacts\publish\FolderGate.App.exe .\artifacts\publish\eslee-folder-locker.exe -Force
          Copy-Item .\artifacts\publish\FolderGate.ElevatedHelper.exe .\artifacts\publish\eslee-folder-locker-helper.exe -Force
          Copy-Item .\artifacts\publish\FolderGate.RecoveryTool.exe .\artifacts\publish\eslee-folder-locker-recovery.exe -Force

      - name: Verify release privacy
        shell: pwsh
        run: .\tools\Verify-ReleasePrivacy.ps1 -PublishRoot .\artifacts\publish

      - name: Build installer
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart("v")
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc `
            "/DAppVersion=$version" `
            "/DSourceDir=$env:GITHUB_WORKSPACE\artifacts\publish" `
            "/DOutputDir=$env:GITHUB_WORKSPACE\artifacts\installer" `
            .\installer\eslee-folder-locker.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Package release zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .\artifacts\release -Force | Out-Null
          Compress-Archive -Path .\artifacts\publish\* -DestinationPath ".\artifacts\release\eslee-folder-locker-$env:GITHUB_REF_NAME-win-x64.zip" -Force

      - name: Record release provenance
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $assets = @("artifacts/installer/eslee-folder-locker-setup-v$version.exe", "artifacts/release/eslee-folder-locker-v$version-win-x64.zip")
          ./scripts/Write-ReleaseManifest.ps1 -Version $version -AssetPaths $assets -VerifiedChecks @('Core/App safe tests with runtime language switching', 'Release privacy check', 'Single publish and multilingual Inno installer')

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            artifacts/installer/
            artifacts/release/
            artifacts/release-manifest-*.json
            artifacts/SHA256SUMS-*.txt

      - name: Create new GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $assets = @("artifacts/installer/eslee-folder-locker-setup-v$version.exe", "artifacts/release/eslee-folder-locker-v$version-win-x64.zip", "artifacts/release-manifest-v$version.json", "artifacts/SHA256SUMS-v$version.txt")
          gh release create "v$version" --verify-tag --title "eslee Folder Locker v$version" --notes-file ".github/release-notes/v$version.md" @assets
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; existing releases are never overwritten.' }
